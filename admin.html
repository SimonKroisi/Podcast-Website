<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Hoch gwimmas nimma</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-wrap { max-width: 960px; margin: 0 auto; padding: 140px 24px 80px; }
  .admin-login { max-width: 360px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .admin-table-wrap { overflow-x: auto; margin-top: 24px; }
  table.admin-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.admin-table th, table.admin-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(243,239,230,0.12); white-space: nowrap; }
  table.admin-table th { color: rgba(243,239,230,0.6); font-weight: 600; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.5px; }
  .admin-links { display: flex; gap: 16px; margin: 24px 0; flex-wrap: wrap; }
  .admin-stat { font-family: var(--font-display); font-size: 1.8rem; color: var(--white); }
  #adminLogout { margin-left: auto; }
  .admin-topbar { display: flex; align-items: center; gap: 16px; }
</style>
</head>
<body>

<div class="noise-overlay"></div>
<div class="admin-wrap">

  <div id="adminLogin" class="admin-login">
    <p class="section-eyebrow">Admin</p>
    <h1 class="section-title" style="font-size:1.6rem;">Login</h1>
    <p class="form-status" id="adminLoginStatus" role="status" aria-live="polite"></p>
    <button class="btn btn-primary btn-spotify" id="adminLoginBtn">Mit Google einloggen</button>
  </div>

  <div id="adminDashboard" style="display:none;">
    <div class="admin-topbar">
      <div>
        <p class="section-eyebrow">Admin</p>
        <h1 class="section-title" style="font-size:1.6rem;">Tippspiel-Übersicht</h1>
      </div>
      <button class="btn btn-ghost" id="adminLogout">Logout</button>
    </div>

    <div class="admin-links">
      <span class="admin-stat"><span id="adminCount">–</span> Anmeldungen</span>
    </div>

    <p class="section-lead">
      Zahlungsstatus (wer regelmäßig zahlt / Abbucher) siehst du im
      <a href="https://dashboard.stripe.com/subscriptions" target="_blank" rel="noopener">Stripe-Dashboard</a>.
      Klick- und Besucherzahlen findest du in der
      <a href="https://console.firebase.google.com/project/hoch-gwimmas-nimma/analytics" target="_blank" rel="noopener">Firebase-Analytics-Konsole</a>.
    </p>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Datum</th>
            <th>Name</th>
            <th>E-Mail</th>
            <th>Bundesliga Meister</th>
            <th>Bundesliga Pokal</th>
            <th>Sonderfrage 1</th>
            <th>Sonderfrage 2</th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
